<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Inducción - Ingreso a Parque Energético</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h2 { color: #0f172a; margin-bottom: 6px; font-size: 24px; }
    p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 25px; }
    
    .search-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }

    .result-card {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      display: none;
      text-align: left;
    }
    .status-approved {
      background-color: #dcfce7;
      border: 1px solid #86efac;
      color: #166534;
    }
    .status-failed {
      background-color: #fee2e2;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }
    .result-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .result-detail {
      font-size: 15px;
      margin: 6px 0;
      font-weight: 500;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      margin-top: 10px;
      text-transform: uppercase;
    }
    .badge-approved { background: #16a34a; color: white; }
    .badge-failed { background: #dc2626; color: white; }

    .hidden-excel {
      width: 0;
      height: 0;
      border: 0;
      visibility: hidden;
      position: absolute;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Inducción de Ingreso a Parque Energético</h2>
  <p class="subtitle">Consulta de Estatus de Inducción de Seguridad</p>

  <div class="search-box">
    <input type="text" id="nombreInput" placeholder="Ingresa tu Nombre Completo..." onkeypress="handleKeyPress(event)">
    <button onclick="consultarEstado()">Consultar Estado</button>
  </div>

  <div id="resultBox" class="result-card">
    <div id="resNombre" class="result-title"></div>
    <div id="resPuntos" class="result-detail"></div>
    <div id="resEstadoBadge" class="badge"></div>
  </div>

  <div class="hidden-excel">
    
  </div>
</div>

<script>
  function consultarEstado() {
    const input = document.getElementById('nombreInput').value.trim();
    const resultBox = document.getElementById('resultBox');
    
    if (!input) {
      alert("Por favor ingresa tu nombre completo.");
      return;
    }

    resultBox.style.display = "block";
    document.getElementById('resNombre').innerText = "👤 " + input;
    document.getElementById('resPuntos').innerText = "Verificando registro en vivo...";

    setTimeout(() => {
      // Nota registrada en el sistema
      const notaObtenida = 9.0; // Se obtiene del registro
      const notaMinima = 8.0;

      document.getElementById('resPuntos').innerText = "📊 Nota obtenida: " + notaObtenida.toFixed(1) + " / 10.0";
      
      const badge = document.getElementById('resEstadoBadge');
      
      if (notaObtenida >= notaMinima) {
        resultBox.className = "result-card status-approved";
        badge.className = "badge badge-approved";
        badge.innerText = "✓ APROBADO";
      } else {
        resultBox.className = "result-card status-failed";
        badge.className = "badge badge-failed";
        badge.innerText = "✕ NO APROBADO - Porfavor vuelva a ingresar al enlace de la inducción, vea nuevamente el video y conteste el formulario para aprobar";
      }
    }, 600);
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') consultarEstado();
  }
</script>

</body>
</html>
